[project]
name = "meridian-fairlend-ai"
version = "2.0.0"
description = "Mission Bharat Explainable AI Loan Decision System compliant with RBI digital lending guidelines"
authors = [
    { name = "Meridian FairLend AI Team" }
]
requires-python = ">=3.11, <3.12"
dependencies = [
    "streamlit>=1.30.0",
    "supabase>=2.0.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
