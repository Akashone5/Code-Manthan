version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meridian_fairlend_api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_PROVIDER=${DB_PROVIDER:-sqlite}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - OFFICER_REGISTRATION_KEY=${OFFICER_REGISTRATION_KEY:-OFFICER-2026}
    volumes:
      - ./meridian_loans.db:/app/meridian_loans.db
      - ./meridian_loan_applications_export.csv:/app/meridian_loan_applications_export.csv
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
